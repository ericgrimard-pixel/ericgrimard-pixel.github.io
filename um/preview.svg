<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Universal Metaphor — Manifestation, la chambre du HUB">
  <rect width="1200" height="630" fill="#05080d"/>
  <rect x="18.5" y="18.5" width="1163" height="593" fill="none" stroke="#c4a574" stroke-width="1" opacity="0.7"/>
  <!-- lattice -->
  <g transform="translate(600 330)" fill="none" stroke="#1e2e42" stroke-width="1.2">
    <ellipse rx="340" ry="155"/>
    <ellipse rx="280" ry="128"/>
    <ellipse rx="220" ry="100"/>
    <ellipse rx="160" ry="73"/>
    <ellipse rx="100" ry="46"/>
    <ellipse rx="50" ry="23"/>
    <line x1="-340" y1="0" x2="340" y2="0" stroke="#1a2636"/>
    <line x1="0" y1="-200" x2="0" y2="90" stroke="#3a4a22" stroke-width="1.4"/>
    <line x1="-80" y1="-40" x2="-80" y2="90" stroke="#1a2636"/>
    <line x1="80" y1="-40" x2="80" y2="90" stroke="#1a2636"/>
  </g>
  <!-- northern purple octahedron (Finance) -->
  <g transform="translate(600 175)">
    <polygon points="0,-42 36,0 0,42 -36,0" fill="#5c4aa8" stroke="#b388ff" stroke-width="1.2"/>
    <polygon points="0,-42 36,0 0,8 -36,0" fill="#7a68c8" stroke="#b388ff" stroke-width="0.8" opacity="0.9"/>
    <text y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#e8c872">Finance</text>
  </g>
  <!-- heart (green) -->
  <g transform="translate(600 330)">
    <polygon points="0,-36 48,0 0,36 -48,0" fill="#2f7a5c" stroke="#5fd690" stroke-width="1.2"/>
    <polygon points="0,-36 48,0 0,6 -48,0" fill="#3d9a74" opacity="0.85"/>
    <rect x="-8" y="28" width="16" height="16" fill="#5fd690" opacity="0.9"/>
  </g>
  <!-- south green -->
  <g transform="translate(600 455)">
    <polygon points="0,-28 38,0 0,28 -38,0" fill="#2a6b52" stroke="#5fd690" stroke-width="1.1"/>
    <ellipse cx="0" cy="0" rx="52" ry="22" fill="none" stroke="#8a734c" stroke-width="1" opacity="0.8"/>
  </g>
  <!-- Art -->
  <g transform="translate(320 330)">
    <polygon points="0,-28 24,0 0,28 -24,0" fill="#6b4ca8" stroke="#b388ff" stroke-width="1.1"/>
    <text y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#c8c0d8">Art</text>
  </g>
  <!-- Sports -->
  <g transform="translate(880 330)">
    <polygon points="0,-26 26,0 0,26 -26,0" fill="#2a5a96" stroke="#4fa7ff" stroke-width="1.1"/>
    <text y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#c0d0e4">Sports</text>
  </g>
  <!-- typography -->
  <text x="56" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3.2" fill="#e8c872">UNIVERSAL METAPHOR</text>
  <line x1="56" y1="76" x2="128" y2="76" stroke="#e8c872" stroke-width="2"/>
  <text x="56" y="580" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#e8e2d6">Manifestation</text>
</svg>
